<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Origo — Smart Socialising for Campus Life. Meet students who share your interests, not just your college." />
    <meta name="theme-color" content="#6C3DFF" />
    <title>Origo — Campus Social App for Indian Students</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Poppins italic weights + Fraunces (italic) are for the canvas-rendered
         Intro Card only (src/lib/introCard.ts) — Fraunces gives the featured
         prompt a real pull-quote moment against Poppins' geometric sans,
         rather than every card text using one typeface. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=Fraunces:ital,wght@1,500;1,600&display=swap" rel="stylesheet" />
    <!-- Google Identity Services — required for "Sign in with Google" -->
    <!-- PSEUDO: Set VITE_GOOGLE_CLIENT_ID in .env to your OAuth 2.0 Client ID from console.cloud.google.com -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Razorpay checkout SDK — required for Premium + Ship a Friend payments -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
